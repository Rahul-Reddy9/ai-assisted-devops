# Prometheus Scrape Configuration for DevOps AI Observability Stack

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "devops-ai"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["devops-ai:9090"]
        labels:
          app: "devops-ai"
          environment: "local"

  - job_name: "prometheus"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"
