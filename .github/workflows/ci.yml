# GitHub Actions CI Workflow for AI-Assisted DevOps Platform

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.14.10"

      - name: Run Ruff Linter
        run: ruff check src tests

      - name: Run Ruff Formatter Check
        run: ruff format --check src tests

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,full]"

      - name: Run Full Pytest Suite
        env:
          NO_COLOR: "1"
          TERM: "dumb"
        run: pytest -v

  build:
    name: Package Build & Wheel Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling

      - name: Build Pure Python Wheel
        run: python -m build --wheel

      - name: Verify Wheel Artifact
        run: |
          ls -la dist/
          test -f dist/devops_ai-0.1.0-py3-none-any.whl

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-ai-wheel
          path: dist/*.whl
          retention-days: 7

  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project & Security Auditing Tool
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          python -m pip install pip-audit
          python -m pip install -e .

      - name: Run Dependency Security Audit
        # Explicitly ignore verified upstream ChromaDB advisories that currently lack PyPI fixes.
        # Note: DevOps AI uses ChromaDB exclusively as an embedded local file vector store, not a network server.
        run: |
          pip-audit --progress-spinner off \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815
