# Docker Compose Orchestration for DevOps AI Observability Stack

services:
  devops-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-ai:local
    container_name: devops-ai-metrics
    command: ["metrics", "serve", "--host", "0.0.0.0", "--port", "9090"]
    ports:
      - "9090:9090"
    environment:
      - APP_ENV=production
      - METRICS_HOST=0.0.0.0
      - METRICS_PORT=9090
      - LOG_LEVEL=INFO
    volumes:
      - devops_ai_data:/app/data
      - devops_ai_incidents:/app/.devops_ai/incidents
    healthcheck:
      test: ["CMD", "devops-ai", "health", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - devops-ai-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: devops-ai-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      devops-ai:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devops-ai-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: devops-ai-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - devops-ai-network

networks:
  devops-ai-network:
    driver: bridge

volumes:
  devops_ai_data:
  devops_ai_incidents:
  prometheus_data:
  grafana_data:
